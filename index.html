<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Тир-лист мейкер | все игры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1f14;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 10px;
            color: #e2f0e5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }
        .container { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .header {
            background: #122b1c;
            border-radius: 16px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border: 1px solid #358a62;
            flex-shrink: 0;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #c8f0d4, #6fbf8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        button {
            background: #1f3d2c;
            border: 1px solid #5fa87a;
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.96); }
        .danger { border-color: #cb6e6e; }
        .counter {
            background: #1a3a2a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
        }
        .main-scroll { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
        #tiers-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        .tier-row {
            background: #112717;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            border: 1px solid #397a58;
            overflow: hidden;
        }
        .tier-label {
            width: 110px;
            background: #2a7a4e;
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            cursor: text;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tier-label span {
            outline: none;
            background: rgba(0,0,0,0.25);
            padding: 6px 8px;
            border-radius: 20px;
            display: inline-block;
            width: 100%;
            font-size: 13px;
        }
        .tier-items {
            flex: 1;
            min-height: 95px;
            background: #0e2618;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }
        .tier-controls {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: #102c1c;
            padding: 0 12px;
            border-left: 1px solid #397a58;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            color: #b5dec5;
            font-family: monospace;
        }
        .image-item {
            width: 80px;
            background: #1d3929;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 2px solid #51a87a;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            padding: 4px;
        }
        .image-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .image-label {
            font-size: 10px;
            text-align: center;
            margin-top: 4px;
            color: #c8f0d4;
            font-weight: 500;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .desc-btn {
            font-size: 9px;
            background: #2a5a3a;
            border: none;
            color: white;
            padding: 2px 6px;
            border-radius: 20px;
            margin-top: 4px;
            cursor: pointer;
            width: 100%;
        }
        .delete-img {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffa0a0;
            border-radius: 10px;
            z-index: 10;
        }
        .unassigned-area {
            background: #112717;
            border-radius: 16px;
            padding: 10px;
            border: 1px solid #398a62;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .unassigned-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
        .unassigned-items { display: flex; flex-wrap: wrap; gap: 10px; min-height: 80px; }
        footer { text-align: center; margin-top: 6px; font-size: 9px; opacity: 0.5; flex-shrink: 0; }

        .modal, .desc-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active, .desc-modal.active { display: flex; }
        .modal-content, .desc-content {
            background: #1a2a1f;
            border-radius: 20px;
            padding: 20px;
            width: 350px;
            max-width: 90%;
            border: 2px solid #4CAF50;
            max-height: 80vh;
            overflow-y: auto;
        }
        .desc-content h3 { margin-bottom: 10px; color: #ffd966; }
        .desc-content p { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
        .modal-content input { width: 100%; padding: 8px; margin: 10px 0; background: #0d1f14; border: 1px solid #4CAF50; color: white; border-radius: 8px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }

        @media (max-width: 600px) {
            .image-item { width: 70px; }
            .image-item img { width: 60px; height: 60px; }
            .image-label { font-size: 9px; max-width: 70px; }
            .tier-label { width: 90px; font-size: 12px; }
            button { padding: 4px 10px; font-size: 11px; }
            h1 { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>ТИР-ЛИСТ МЕЙКЕР</h1>
        <div class="toolbar">
            <input type="file" id="addImagesInput" multiple accept="image/*" style="display:none">
            <button id="uploadBtn">➕ ДОБАВИТЬ</button>
            <button id="addRowBtn">➕ РЯД</button>
            <button id="clearAllBtn" class="danger">🗑 ВСЕ КАРТИНКИ</button>
            <button id="resetBtn" class="danger">🔄 СБРОС</button>
        </div>
        <div class="counter" id="counter">0 картинок</div>
    </div>

    <div class="main-scroll">
        <div id="tiers-container"></div>
    </div>

    <div class="unassigned-area">
        <div class="unassigned-title">📦 НЕРАСПРЕДЕЛЁННЫЕ (перетащи в тиры)</div>
        <div id="unassignedItems" class="unassigned-items"></div>
    </div>
    <footer>📝 Клик на текст — редактирование | 🖱️ Перетаскивай картинки | ℹ️ Кнопка описания</footer>
</div>

<div id="labelModal" class="modal">
    <div class="modal-content">
        <h3>Введите название игры</h3>
        <input type="text" id="labelInput" placeholder="Название" value="Новая игра">
        <div class="modal-buttons">
            <button id="modalOkBtn">OK</button>
            <button id="modalCancelBtn">Отмена</button>
        </div>
    </div>
</div>

<div id="colorModal" class="modal">
    <div class="modal-content">
        <h3>Выберите цвет для ряда</h3>

            <div class="color-option" style="width: 40px; height: 40px; background: #33a362; cursor: pointer;" data-color="#33a362"></div>
            <div class="color-option" style="width: 40px; height: 40px; background: #4cb87a; cursor: pointer;" data-color="#4cb87a"></div>
            <div class="color-option" style="width: 40px; height: 40px; background: #74cf94; cursor: pointer;" data-color="#74cf94"></div>
            <div class="color-option" style="width: 40px; height: 40px; background: #dbac5e; cursor: pointer;" data-color="#dbac5e"></div>
            <div class="color-option" style="width: 40px; height: 40px; background: #cd7a7a; cursor: pointer;" data-color="#cd7a7a"></div>
        </div>
        <div class="modal-buttons">
            <button id="colorModalCancelBtn">Отмена</button>
        </div>
    </div>
</div>

        let unassignedItems = [];
        let nextId = 1;
        let dragSource = null;

        function generateId() { return Date.now() + '-' + Math.random() + '-' + (nextId++); }
        function updateCounter() {
            const total = unassignedItems.length + tiers.reduce((sum, tier) => sum + tier.items.length, 0);
            document.getElementById('counter').innerText = total + ' картинок';
        }

        function showDescription(label) {
            const text = descriptions[label] || "Описание временно отсутствует.\nСюжет: узнайте в игре. Геймплей: отличный, проверьте сами!";
            const modal = document.createElement('div');
            modal.className = 'desc-modal active';
            modal.innerHTML = `<div class="desc-content" onclick="event.stopPropagation()"><h3>📖 ${label}</h3><p>${text.replace(/\n/g, '<br>')}</p><div class="modal-buttons"><button id="closeDescBtn">Закрыть</button></div></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeDescBtn').onclick = () => modal.remove();
            modal.onclick = () => modal.remove();
        }

        function showLabelModal(defaultValue) {
            return new Promise((resolve) => {
                const modal = document.getElementById('labelModal');
                const input = document.getElementById('labelInput');
                const okBtn = document.getElementById('modalOkBtn');
                const cancelBtn = document.getElementById('modalCancelBtn');
                input.value = defaultValue || "Новая игра";
                modal.classList.add('active');
                input.focus();
                const onOk = () => { modal.classList.remove('active'); cleanup(); resolve(input.value); };
                const onCancel = () => { modal.classList.remove('active'); cleanup(); resolve(null); };
                const cleanup = () => {
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                };
                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
                input.onkeypress = (e) => { if (e.key === 'Enter') onOk(); };
            });
        }
        
        function showColorModal() {
            return new Promise((resolve) => {
                const modal = document.getElementById('colorModal');
                const options = document.querySelectorAll('.color-option');
                const cancelBtn = document.getElementById('colorModalCancelBtn');
                modal.classList.add('active');
                const onSelect = (color) => { modal.classList.remove('active'); cleanup(); resolve(color); };
                const onCancel = () => { modal.classList.remove('active'); cleanup(); resolve(null); };
                const cleanup = () => {
                    options.forEach(opt => opt.removeEventListener('click', opt.handler));
                    cancelBtn.removeEventListener('click', onCancel);
                };
                options.forEach(opt => {
                    const color = opt.getAttribute('data-color');
                    const handler = () => onSelect(color);
                    opt.addEventListener('click', handler);
                    opt.handler = handler;
                });
                cancelBtn.addEventListener('click', onCancel);
            });
        }

        function render() {
            const container = document.getElementById('tiers-container');
            container.innerHTML = '';
            tiers.forEach((tier, idx) => {
                const row = document.createElement('div');
                row.className = 'tier-row';
                const labelDiv = document.createElement('div');
                labelDiv.className = 'tier-label';
                labelDiv.style.backgroundColor = tier.color;
                const labelSpan = document.createElement('span');
                labelSpan.contentEditable = 'true';
                labelSpan.innerText = tier.label;
                labelSpan.addEventListener('blur', (e) => { tiers[idx].label = e.target.innerText; render(); });
                labelDiv.appendChild(labelSpan);
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'tier-items';
                itemsDiv.dataset.tierIndex = idx;
                tier.items.forEach((item, itemIdx) => {
                    itemsDiv.appendChild(createImageElement(item.id, item.url, item.label, idx, itemIdx, false));
                });
                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'tier-controls';
                const colorBtn = document.createElement('button');
                colorBtn.innerText = '🎨';
                colorBtn.className = 'icon-btn';
                colorBtn.onclick = async () => { const newColor = await showColorModal(); if (newColor) { tiers[idx].color = newColor; render(); } };
                const upBtn = document.createElement('button');
                upBtn.innerText = '⬆';
                upBtn.className = 'icon-btn';
                upBtn.onclick = () => { if (idx > 0) { [tiers[idx-1], tiers[idx]] = [tiers[idx], tiers[idx-1]]; render(); } };
                const downBtn = document.createElement('button');
                downBtn.innerText = '⬇';
                downBtn.className = 'icon-btn';
                downBtn.onclick = () => { if (idx < tiers.length-1) { [tiers[idx+1], tiers[idx]] = [tiers[idx], tiers[idx+1]]; render(); } };
                const delBtn = document.createElement('button');
                delBtn.innerText = '🗑';
                delBtn.className = 'icon-btn';
                delBtn.onclick = () => { tiers.splice(idx,1); render(); };
                controlsDiv.appendChild(colorBtn);
                controlsDiv.appendChild(upBtn);
                controlsDiv.appendChild(downBtn);
                controlsDiv.appendChild(delBtn);
                row.appendChild(labelDiv);
                row.appendChild(itemsDiv);
                row.appendChild(controlsDiv);
                container.appendChild(row);
            });
            const unassignedContainer = document.getElementById('unassignedItems');
            unassignedContainer.innerHTML = '';
            unassignedItems.forEach((item) => {
                unassignedContainer.appendChild(createImageElement(item.id, item.url, item.label, null, null, true));
            });
            attachDragDropEvents();
            updateCounter();
        }

        function createImageElement(id, url, label, tierIndex, itemIndex, fromUnassigned) {
            const div = document.createElement('div');
            div.className = 'image-item';
            div.draggable = true;
            div.setAttribute('data-id', id);
            if (tierIndex !== undefined) div.setAttribute('data-tier-index', tierIndex);
            if (itemIndex !== undefined) div.setAttribute('data-item-index', itemIndex);
            div.setAttribute('data-from-unassigned', fromUnassigned);
            const img = document.createElement('img');
            img.src = url;
            img.onclick = (e) => { e.stopPropagation(); showDescription(label); };
            div.appendChild(img);
            const labelSpan = document.createElement('div');
            labelSpan.className = 'image-label';
            labelSpan.innerText = label;
            div.appendChild(labelSpan);
            const descBtn = document.createElement('button');
            descBtn.innerText = 'ℹ️';
            descBtn.className = 'desc-btn';
            descBtn.onclick = (e) => { e.stopPropagation(); showDescription(label); };
            div.appendChild(descBtn);
            const delSpan = document.createElement('span');
            delSpan.className = 'delete-img';
            delSpan.innerText = '✕';
            delSpan.onclick = (e) => {
                e.stopPropagation();
                if (fromUnassigned) {
                    const idx = unassignedItems.findIndex(i => i.id === id);
                    if (idx !== -1) unassignedItems.splice(idx, 1);
                } else {
                    const tier = tiers[tierIndex];
                    if (tier && tier.items[itemIndex]) tier.items.splice(itemIndex, 1);
                }
                render();
            };
            div.appendChild(delSpan);
            div.addEventListener('dragstart', (e) => {
                dragSource = { fromUnassigned, tierIndex, itemIndex, id };
                e.dataTransfer.setData('text/plain', id);
                div.style.opacity = '0.4';
            });
            div.addEventListener('dragend', () => {
                div.style.opacity = '';
                dragSource = null;
            });
            return div;
        }

        function attachDragDropEvents() {
            const tierContainers = document.querySelectorAll('.tier-items');
            tierContainers.forEach(container => {
                container.addEventListener('dragover', (e) => e.preventDefault());
                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (!dragSource) return;
                    const targetTierIdx = parseInt(container.dataset.tierIndex);
                    if (isNaN(targetTierIdx)) return;
                    if (dragSource.fromUnassigned) {
                        const srcIdx = unassignedItems.findIndex(i => i.id === dragSource.id);
                        if (srcIdx !== -1) {
                            const [moved] = unassignedItems.splice(srcIdx, 1);
                            tiers[targetTierIdx].items.push(moved);
                        }
                    } else {
                        const srcTier = tiers[dragSource.tierIndex];
                        if (srcTier && srcTier.items[dragSource.itemIndex]) {
                            const [moved] = srcTier.items.splice(dragSource.itemIndex, 1);
                            tiers[targetTierIdx].items.push(moved);
                        }
                    }
                    render();
                });
            });
            const unassignedZone = document.getElementById('unassignedItems');
            if (unassignedZone) {
                unassignedZone.addEventListener('dragover', (e) => e.preventDefault());
                unassignedZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (!dragSource) return;
                    if (!dragSource.fromUnassigned) {
                        const srcTier = tiers[dragSource.tierIndex];
                        if (srcTier && srcTier.items[dragSource.itemIndex]) {
                            const [moved] = srcTier.items.splice(dragSource.itemIndex, 1);
                            unassignedItems.push(moved);
                        }
                        render();
                    }
                });
            }
        }

        document.getElementById('uploadBtn').onclick = () => document.getElementById('addImagesInput').click();
        document.getElementById('addImagesInput').onchange = async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const label = await showLabelModal("Новая игра");
                    if (label === null) continue;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        unassignedItems.push({ id: generateId(), url: ev.target.result, label: label.trim() || "Без названия" });
                        render();
                    };
                    reader.readAsDataURL(file);
                }
            }
            e.target.value = '';
        };
        
        document.getElementById('addRowBtn').onclick = () => {
            tiers.push({ label: "НОВЫЙ ТИР", color: "#4fa87a", items: [] });
            render();
        };
        
        document.getElementById('clearAllBtn').onclick = async () => {
            const modalDiv = document.createElement('div');
            modalDiv.style.position = 'fixed';
            modalDiv.style.top = '0';
            modalDiv.style.left = '0';
            modalDiv.style.width = '100%';
            modalDiv.style.height = '100%';
            modalDiv.style.background = 'rgba(0,0,0,0.8)';
            modalDiv.style.zIndex = '2000';
            modalDiv.style.display = 'flex';
            modalDiv.style.justifyContent = 'center';
            modalDiv.style.alignItems = 'center';
            modalDiv.innerHTML = `<div style="background: #1a2a1f; border-radius: 20px; padding: 20px; width: 300px; border: 2px solid #cb6e6e;"><h3>Подтверждение</h3><p>Удалить ВСЕ картинки?</p><div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;"><button id="confirmYes" style="background: #cb6e6e;">ДА</button><button id="confirmNo">НЕТ</button></div></div>`;
            document.body.appendChild(modalDiv);
            const result = await new Promise((resolve) => {
                document.getElementById('confirmYes').onclick = () => { resolve(true); modalDiv.remove(); };
                document.getElementById('confirmNo').onclick = () => { resolve(false); modalDiv.remove(); };
            });
            if (result) {
                tiers.forEach(tier => tier.items = []);
                unassignedItems = [];
                render();
            }
        };
        
        document.getElementById('resetBtn').onclick = () => {
            tiers = [
                { label: "S ТИР", color: "#238c51", items: [] },
                { label: "A ТИР", color: "#33a362", items: [] },
                { label: "B ТИР", color: "#4cb87a", items: [] },
                { label: "C ТИР", color: "#74cf94", items: [] },
                { label: "D ТИР", color: "#dbac5e", items: [] },
                { label: "E ТИР", color: "#cd7a7a", items: [] }
            ];
            unassignedItems = [];
            initialItems.forEach(item => {
                unassignedItems.push({ id: generateId(), url: item.url, label: item.label });
            });
            render();
        };

        initialItems.forEach(item => {
            unassignedItems.push({ id: generateId(), url: item.url, label: item.label });
        });
        
        render();
    })();
</script>
</body>
</html>
